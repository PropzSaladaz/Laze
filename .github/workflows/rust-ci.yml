name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'controller_server/**'
      - 'desktop_app/src-tauri/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'controller_server/**'
      - 'desktop_app/src-tauri/**'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxdo-dev build-essential \
          libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        # Built-in caching via Swatinem/rust-cache
    
    - name: Build (debug)
      working-directory: ./controller_server
      run: cargo build --verbose

    - name: Build (release)
      working-directory: ./controller_server
      run: cargo build --release --verbose

    # Note: --lib runs only library unit tests, excluding integration tests
    # Tests marked #[ignore] require X11 display server and won't run in headless CI
    - name: Run tests
      working-directory: ./controller_server
      run: cargo test --verbose --lib

    - name: Check formatting
      working-directory: ./controller_server
      continue-on-error: true
      run: cargo fmt --check

    - name: Run clippy
      working-directory: ./controller_server
      continue-on-error: true
      run: cargo clippy -- -D warnings

  # Verify the Tauri desktop app builds (release mode) so we catch
  # breakage before tagging a release.
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tauri_args: --bundles deb,appimage
          - os: macos-latest
            tauri_args: --bundles dmg
          - os: windows-latest
            tauri_args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxdo-dev build-essential \
          libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: ./desktop_app
      run: npm ci

    - name: Install macOS native npm packages
      if: runner.os == 'macOS'
      working-directory: ./desktop_app
      run: |
        PACKAGES=(
          "@tauri-apps/cli:@tauri-apps/cli-darwin-arm64"
          "lightningcss:lightningcss-darwin-arm64"
          "esbuild:@esbuild/darwin-arm64"
          "next:@next/swc-darwin-arm64"
          "sharp:@img/sharp-darwin-arm64"
          "@tailwindcss/oxide:@tailwindcss/oxide-darwin-arm64"
        )

        INSTALLS=()
        for entry in "${PACKAGES[@]}"; do
          PKG="${entry%%:*}"
          OPT="${entry##*:}"
          VERSION=$(node -p "require('./node_modules/${PKG}/package.json').optionalDependencies['${OPT}']")
          if [ -z "$VERSION" ]; then
            echo "WARNING: Could not resolve ${OPT} from ${PKG}, skipping"
            continue
          fi
          INSTALLS+=("${OPT}@${VERSION}")
        done

        npm install --no-save "${INSTALLS[@]}"

    - name: Install Windows native npm packages
      if: runner.os == 'Windows'
      working-directory: ./desktop_app
      shell: pwsh
      run: |
        $packages = @(
          @{ Package = '@tauri-apps/cli'; Optional = '@tauri-apps/cli-win32-x64-msvc' },
          @{ Package = 'lightningcss'; Optional = 'lightningcss-win32-x64-msvc' },
          @{ Package = 'esbuild'; Optional = '@esbuild/win32-x64' },
          @{ Package = 'next'; Optional = '@next/swc-win32-x64-msvc' },
          @{ Package = 'sharp'; Optional = '@img/sharp-win32-x64' },
          @{ Package = '@tailwindcss/oxide'; Optional = '@tailwindcss/oxide-win32-x64-msvc' }
        )

        $installs = @()
        foreach ($entry in $packages) {
          $version = node -p "require('./node_modules/$($entry.Package)/package.json').optionalDependencies['$($entry.Optional)']"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve optional dependency $($entry.Optional) from $($entry.Package)"
          }
          $installs += "$($entry.Optional)@$version"
        }

        npm install --no-save $installs

    - name: Build Tauri app (release)
      working-directory: ./desktop_app
      run: npx tauri build ${{ matrix.tauri_args }}
