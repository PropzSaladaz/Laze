name: Flutter Mobile Client CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile_client/**'
      - 'scripts/check_flutter_version.py'
      - 'scripts/test_flutter_version.py'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'mobile_client/**'
      - 'scripts/check_flutter_version.py'
      - 'scripts/test_flutter_version.py'
      - '.github/workflows/flutter-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: mobile_client/pubspec.yaml
        channel: 'stable'
        cache: true
    
    - name: Verify pinned Flutter SDK
      run: python3 scripts/check_flutter_version.py

    - name: Test Flutter SDK version guard
      run: python3 scripts/test_flutter_version.py

    - name: Get locked dependencies
      working-directory: ./mobile_client
      run: flutter pub get --enforce-lockfile
    
    - name: Verify Flutter installation
      run: flutter doctor -v
    
    - name: Analyze code
      working-directory: ./mobile_client
      continue-on-error: true
      run: flutter analyze --no-pub
    
    - name: Run tests
      working-directory: ./mobile_client
      run: flutter test --no-pub
    
    # Using 'dart format' as 'flutter format' is deprecated since Flutter 3.7
    - name: Check formatting
      working-directory: ./mobile_client
      continue-on-error: true
      run: dart format --set-exit-if-changed .
    
    # Pull-request compilation uses debug signing; release signing is required by release-mobile.yml.
    - name: Build debug APK (Android)
      working-directory: ./mobile_client
      run: flutter build apk --debug --no-pub

  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: mobile_client/pubspec.yaml
        channel: 'stable'
        cache: true

    - name: Verify pinned Flutter SDK
      run: python3 scripts/check_flutter_version.py

    - name: Get locked dependencies
      working-directory: ./mobile_client
      run: flutter pub get --enforce-lockfile

    - name: Run code generation
      working-directory: ./mobile_client
      run: dart run build_runner build --delete-conflicting-outputs

    # Unsigned build — verifies iOS compilation without Apple Developer certs
    - name: Build iOS (unsigned)
      working-directory: ./mobile_client
      run: flutter build ios --release --no-codesign --no-tree-shake-icons --no-pub
