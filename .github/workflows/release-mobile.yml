name: Release Mobile App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  # Gate: the committed manifest versions must equal the tag before we build,
  # so a forgotten bump can never ship a mismatched artifact.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest versions match the tag
        run: scripts/set-version.sh --check "${{ github.event.inputs.version || github.ref_name }}"

  build-android:
    needs: verify-version
    runs-on: ubuntu-latest
    environment: Laze Android App Deployment
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile_client/pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Verify pinned Flutter SDK
        run: python3 scripts/check_flutter_version.py

      - name: Get locked dependencies
        working-directory: mobile_client
        run: flutter pub get --enforce-lockfile

      - name: Test Android signing verification
        run: python3 scripts/test_android_signing.py

      - name: Run code generation
        working-directory: mobile_client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Require release signing credentials and decode keystore
        working-directory: mobile_client/android
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Android release signing setting: $name"
              exit 1
            fi
          done
          fingerprint="${ANDROID_SIGNING_CERT_SHA256//:/}"
          if [[ ! "$fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 must be the expected release/upload certificate SHA-256 fingerprint."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          test -s app/upload-keystore.jks
          echo "KEYSTORE_PATH=upload-keystore.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

      - name: Build APK
        working-directory: mobile_client
        run: flutter build apk --release --no-tree-shake-icons --no-pub
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build App Bundle (AAB)
        working-directory: mobile_client
        run: flutter build appbundle --release --no-tree-shake-icons --no-pub
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK and AAB release signatures
        shell: bash
        run: |
          set -euo pipefail
          export APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          java scripts/VerifyAndroidSigning.java \
            mobile_client/build/app/outputs/flutter-apk/app-release.apk \
            mobile_client/build/app/outputs/bundle/release/app-release.aab
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

      - name: Remove temporary release keystore
        if: always()
        run: rm -f mobile_client/android/app/upload-keystore.jks

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: 'Laze ${{ steps.get_version.outputs.VERSION }}'
          body: |
            ## Laze Mobile App

            Download the APK to install directly on your Android device.

            ### Installation
            1. Download `app-release.apk`
            2. Enable "Install from unknown sources" in Android settings
            3. Open the APK file to install
          files: |
            mobile_client/build/app/outputs/flutter-apk/app-release.apk
            mobile_client/build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    needs: verify-version
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile_client/pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Verify pinned Flutter SDK
        run: python3 scripts/check_flutter_version.py

      - name: Get locked dependencies
        working-directory: mobile_client
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        working-directory: mobile_client
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Code signing (only when Apple Developer secrets are configured) ──
      - name: Install Apple certificate and provisioning profile
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profile
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "IOS_SIGNING=true" >> $GITHUB_ENV

      # ── Build ──
      - name: Build iOS (signed)
        if: env.IOS_SIGNING == 'true'
        working-directory: mobile_client
        run: |
          flutter build ipa --release --no-tree-shake-icons \
            --export-options-plist=ios/ExportOptions.plist --no-pub

      - name: Build iOS (unsigned — verify compilation)
        if: env.IOS_SIGNING != 'true'
        working-directory: mobile_client
        run: flutter build ios --release --no-codesign --no-tree-shake-icons --no-pub

      # ── Upload artifacts ──
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload IPA to release
        if: env.IOS_SIGNING == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: 'Laze ${{ steps.get_version.outputs.VERSION }}'
          files: mobile_client/build/ios/ipa/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup ──
      - name: Clean up keychain
        if: always() && env.IOS_SIGNING == 'true'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

