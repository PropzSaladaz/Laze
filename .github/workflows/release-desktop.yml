name: Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build-app:
    permissions:
      contents: write
    
    strategy:
      # If windows fails, let Linux build (and vice versa)
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tauri_args: --bundles deb,appimage
          - os: windows-latest
            tauri_args: --bundles nsis,msi
          - os: macos-latest
            tauri_args: --bundles dmg
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop_app/src-tauri
            controller_server

      - name: Install frontend dependencies
        working-directory: desktop_app
        run: npm ci

      - name: Install Windows native npm packages
        if: matrix.os == 'windows-latest'
        working-directory: desktop_app
        shell: pwsh
        run: |
          $packages = @(
            @{ Package = '@tauri-apps/cli'; Optional = '@tauri-apps/cli-win32-x64-msvc' },
            @{ Package = 'lightningcss'; Optional = 'lightningcss-win32-x64-msvc' },
            @{ Package = 'esbuild'; Optional = '@esbuild/win32-x64' },
            @{ Package = 'next'; Optional = '@next/swc-win32-x64-msvc' },
            @{ Package = 'sharp'; Optional = '@img/sharp-win32-x64' },
            @{ Package = '@tailwindcss/oxide'; Optional = '@tailwindcss/oxide-win32-x64-msvc' }
          )

          $installs = @()
          foreach ($entry in $packages) {
            $version = node -p "require('./node_modules/$($entry.Package)/package.json').optionalDependencies['$($entry.Optional)']"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
              throw "Unable to resolve optional dependency $($entry.Optional) from $($entry.Package)"
            }
            $installs += "$($entry.Optional)@$version"
          }

          npm install --no-save $installs

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop_app
          tauriScript: npx tauri
          args: ${{ matrix.tauri_args }}
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'Laze Server ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: 'Release ${{ github.event.inputs.version || github.ref_name }} of Laze Server. See assets below for your system.'
          releaseDraft: false
          prerelease: false
