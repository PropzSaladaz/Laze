name: Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build-app:
    permissions:
      contents: write
    
    strategy:
      # If windows fails, let Linux build (and vice versa)
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop_app/src-tauri
            controller_server

      - name: Install frontend dependencies
        working-directory: desktop_app
        run: npm ci

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop_app
          tagName: ${{ github.ref_name }}
          releaseName: 'Laze Server ${{ github.ref_name }}'
          releaseBody: 'Release ${{ github.ref_name }} of Laze Server. See assets below for your system.'
          releaseDraft: true
          prerelease: false
